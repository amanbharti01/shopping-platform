name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/deployment.yaml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Test image
        run: |
          docker build -t shopping-platform:test .
          docker run -d --name shopping-platform-test -p 3000:3000 shopping-platform:test

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Application is healthy"
              docker rm -f shopping-platform-test
              exit 0
            fi
            sleep 2
          done

          echo "Application failed health check"
          docker logs shopping-platform-test
          docker rm -f shopping-platform-test
          exit 1

      - name: Update Kubernetes image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          sed -i "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml

          echo "Updated Kubernetes manifest:"
          grep "image:" k8s/deployment.yaml

      - name: Commit and push GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest change required"
            exit 0
          fi

          git commit -m "chore: update image to ${GITHUB_SHA}"
          git push origin HEAD:main
