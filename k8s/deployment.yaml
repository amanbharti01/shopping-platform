apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-platform
  template:
    metadata:
      labels:
        app: shopping-platform
    spec:
      containers:
        - name: shopping-platform
          image: ghcr.io/amanbharti01/shopping-platform:4d113317f5c8fa3934944491fe9b966417be5aaa
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
