apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-platform
  template:
    metadata:
      labels:
        app: shopping-platform
    spec:
      containers:
        - name: shopping-platform
          image: shopping-platform:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
